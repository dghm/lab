<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="robots" content="noindex, nofollow">
  <title>DGHM 電子賀卡 Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="DGHM 電子賀卡 Dashboard 首頁">
      <span class="brand-mark">DGHM</span>
      <span class="brand-name">電子賀卡平台</span>
    </a>
    <span class="environment-label">內部管理</span>
  </header>

  <main>
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Greeting Cards</p>
        <h1 id="page-title">賀卡管理</h1>
        <p class="intro">先選檔期，再選卡。一個檔期＝中秋→聖誕→隔年春節；公版看預覽，個人化看逐客戶清單。</p>
      </div>
      <div class="summary" aria-label="賀卡統計">
        <div><strong id="card-count">—</strong><span>賀卡模板</span></div>
        <div><strong id="published-count">—</strong><span>公開中</span></div>
        <div class="is-personal"><strong id="personal-count">—</strong><span>個人化版本</span></div>
      </div>
    </section>

    <div class="workspace">
      <section class="catalog-panel" aria-labelledby="catalog-title">
        <div class="panel-heading">
          <div>
            <p class="section-label">Card catalog</p>
            <h2 id="catalog-title">賀卡清單</h2>
          </div>
          <p id="catalog-status" class="catalog-status" role="status">正在讀取…</p>
        </div>

        <div id="campaign-switch" class="campaign-switch" role="tablist" aria-label="選擇計畫檔期"></div>

        <div id="card-list" class="card-list" aria-live="polite"></div>
      </section>

      <section class="preview-panel" aria-labelledby="detail-title">
        <!-- 公版：跨裝置預覽 -->
        <div id="mode-preview" class="detail-mode">
          <div class="preview-heading">
            <div>
              <p class="section-label">Live preview · 公版</p>
              <h2 id="detail-title">選擇一張賀卡</h2>
            </div>
            <div class="device-switch" aria-label="預覽裝置">
              <button type="button" class="device-button is-active" data-device="desktop" aria-pressed="true">桌機</button>
              <button type="button" class="device-button" data-device="mobile" aria-pressed="false">手機</button>
            </div>
          </div>

          <div id="preview-stage" class="preview-stage is-empty">
            <div class="preview-placeholder">
              <strong>尚未選擇賀卡</strong>
              <span>從左側清單選擇一張賀卡開始預覽。</span>
            </div>
            <div class="ambient-glow" aria-hidden="true"><span></span></div>
            <div class="device-frame" hidden>
              <div class="device-browser-bar" aria-hidden="true">
                <i></i><i></i><i></i>
                <span id="preview-address"></span>
              </div>
              <iframe id="card-preview" title="賀卡預覽"></iframe>
            </div>
          </div>

          <div class="preview-footer">
            <div>
              <span id="preview-state" class="preview-state">尚未選擇</span>
              <span id="preview-url" class="preview-url"></span>
            </div>
            <a id="open-full-card" class="text-link" href="#" target="_blank" rel="noopener" hidden>另開完整頁面 ↗</a>
          </div>
        </div>

        <!-- 個人化：逐客戶清單 -->
        <div id="mode-roster" class="detail-mode" hidden>
          <div class="preview-heading">
            <div>
              <p class="section-label">Personalized roster · 個人化</p>
              <h2 id="roster-title">逐客戶版本</h2>
            </div>
          </div>

          <div class="roster-tools">
            <label class="search">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
              <input id="roster-search" type="text" placeholder="搜尋客戶、公司或短碼…" autocomplete="off">
            </label>
            <span class="roster-count" id="roster-count"></span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>客戶</th><th>祝賀詞</th><th>狀態</th><th>短碼</th></tr>
              </thead>
              <tbody id="roster-body"></tbody>
            </table>
          </div>

          <div class="roster-footer">
            <span class="roster-src" id="roster-src"></span>
            <span id="roster-stat"></span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <span>萬能數維有限公司</span>
    <span>DGHM Greeting Cards</span>
  </footer>

  <template id="card-template">
    <article class="card-item">
      <button type="button" class="card-select">
        <span class="thumbnail-wrap">
          <img class="card-thumbnail" alt="" loading="lazy">
          <span class="thumbnail-fallback" aria-hidden="true"></span>
        </span>
        <span class="card-summary">
          <span class="card-topline">
            <span class="status-badge"></span>
            <span class="kind-tag"></span>
            <span class="cross-tag" hidden>跨年檔期</span>
          </span>
          <span class="festival-label"></span>
          <strong class="card-title"></strong>
          <span class="card-message"></span>
          <span class="card-meta">
            <span><small>正式路徑</small><code class="canonical-path"></code></span>
            <span><small>短碼</small><code class="short-code"></code></span>
          </span>
          <span class="card-bottomline">
            <span class="preview-action"></span>
            <span class="publish-note"></span>
          </span>
        </span>
      </button>
    </article>
  </template>

  <script src="dashboard.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- 每張新卡從這份骨架複製到 cards/<year>/<festival>/index.html，再填入自己的視覺。 -->
  <!-- 依節慶主色調整 -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- SEO / 分享預覽（公版賀卡需填寫；逐客戶個人化頁請改為 noindex，見下方註解） -->
  <title>賀卡標題</title>
  <meta name="description" content="賀卡祝福文字摘要。">
  <link rel="canonical" href="https://cards.dghm.tw/YYYY/festival-slug/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="賀卡標題">
  <meta property="og:description" content="賀卡祝福文字摘要。">
  <meta property="og:url" content="https://cards.dghm.tw/YYYY/festival-slug/">
  <meta property="og:image" content="https://cards.dghm.tw/YYYY/festival-slug/preview-final.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 個人化（逐客戶）頁面請改用： <meta name="robots" content="noindex, nofollow"> 且不建立公開索引 -->

  <!-- 平台共用基底：reset + 減少動態偏好 + 重播機制 -->
  <link rel="stylesheet" href="../../../shared/base.css">

  <style>
    /* ── 本卡專屬視覺與動畫寫在這裡（版面、圖層座標、keyframes、RWD）── */
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04070f;
      padding: 24px;
      overflow: clip;
    }

    .card {
      position: relative;
      width: min(100%, 1071px);
      aspect-ratio: 1071 / 506;
      overflow: hidden;
      container-type: inline-size;
    }

    /* 重播按鈕：顏色可依節慶主色調整，行為由 shared/replay.js 提供 */
    .replay-btn {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .replay-btn:hover,
    .replay-btn:focus-visible {
      transform: scale(1.04);
      outline: none;
    }

    .replay-btn svg { width: 18px; height: 18px; display: block; }
  </style>
</head>
<body>
  <div class="card" aria-label="賀卡：完整祝福文字，供螢幕閱讀器讀出。">
    <!-- ── 本卡的圖層、標題、祝福文字放這裡 ── -->

    <button type="button" class="replay-btn" aria-label="重新播放動畫" title="重新播放">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 12a7.5 7.5 0 0 1 12.7-5.4L19 8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 4.5V8.5H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.5 12a7.5 7.5 0 0 1-12.7 5.4L5 15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 19.5V15.5H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- 平台共用重播：需 .card 內含一顆 .replay-btn -->
  <script src="../../../shared/replay.js" defer></script>
</body>
</html>
